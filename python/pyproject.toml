[project]
name = "apiverve-gdpdata"
version = "1.2.5"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Get GDP (Gross Domestic Product) data for any country including current values and historical data going back to 1960. With changes=true it also returns the direction against the previous year, and on paid plans the prior year's GDP, the dollar and percent change, whether real growth is accelerating or slowing, and 5- and 10-year compound annual growth."
keywords = ["gdp api", "gross domestic product", "gdp by country", "economic data", "world bank data"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/gdp?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/gdp?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/gdp-api"
Twitter = "https://twitter.com/apivervehq"
