openapi: 3.0.4
info:
  title: GDP Data
  description: >-
    Get GDP (Gross Domestic Product) data for any country including current
    values and historical data going back to 1960. With changes=true it also
    returns the direction against the previous year, and on paid plans the prior
    year's GDP, the dollar and percent change, whether real growth is
    accelerating or slowing, and 5- and 10-year compound annual growth.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/gdp:
    get:
      summary: GDP Data
      description: >-
        Get GDP data for a specific country. Returns latest data by default, or
        data for a specific year if specified. With changes=true, adds the
        year-over-year change, growth trend, 5-year average growth and 5- and
        10-year compound annual growth.
      operationId: gdp
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: ISO 2 or 3-letter country code (e.g., US, USA, GB, GBR)
          example: US
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Specific year to retrieve data for (1960-present). Returns latest if
            not specified.
          example: 2023
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the change against the previous year, the growth trend, the
            5-year average growth rate and the 5- and 10-year compound annual
            growth rates
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  countryName: United States
                  currency: USD
                  year: 2025
                  gdp: 30769700000000
                  gdpFormatted: $30.77 trillion
                  gdpGrowth: 2.16
                  gdpPerCapita: 90027
                  count: 1
                  years:
                    - year: 2025
                      gdp: 30769700000000
                      gdpFormatted: $30.77 trillion
                      gdpGrowth: 2.16
                      gdpPerCapita: 90027
                  previousYear: 2024
                  changeDirection: up
                  previousGdp: 29298013000000
                  gdpChange: 1471687000000
                  gdpChangePercent: 5.02
                  previousGdpGrowth: 2.79
                  growthTrend: slowing
                  gdpPerCapitaChangePercent: 4.48
                  gdpCagr5y: 7.56
                  gdpCagr10y: 5.34
                  averageGrowth5y: 3.31
                code: 200
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  country: US
  changes: true
